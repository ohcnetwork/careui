<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="site-favicon" rel="icon" href="%FAVICON_HREF%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Care·ui</title>
    <script>
      (function () {
        var env = "%DEPLOY_ENV%";
        var faviconByEnv = {
          preview: "/favicon.preview.ico",
          development: "/favicon.development.ico",
        };
        var expectedFavicon =
          env === "production"
            ? "/favicon.ico"
            : faviconByEnv[env] || "/favicon.development.ico";
        var faviconLink = document.getElementById("site-favicon");
        if (faviconLink && faviconLink.getAttribute("href") !== expectedFavicon) {
          faviconLink.setAttribute("href", expectedFavicon);
        }

        var scale = { small: 0.875, default: 1, large: 1.125, larger: 1.25 };
        var saved = localStorage.getItem("careui-font-size");
        var value = scale[saved] || 1;
        if (value !== 1) {
          document.documentElement.style.setProperty("--font-size-scale", value);
        }

        var theme = localStorage.getItem("vite-ui-theme") || "system";
        var dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.style.setProperty("--loading-bg", dark ? "#0a0a0a" : "#fff");
      })();
    </script>
  </head>
  <body>
    <div
      id="app-loading"
      style="position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;background:var(--loading-bg,#fff);z-index:9999;font-family:sans-serif"
    ></div>
    <div id="root"></div>
    <script src="/loading-screen.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
